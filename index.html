<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Toro Dashboard - Summary 2026</title>
    <!-- Tailwind CSS untuk styling -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse untuk membaca CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="flex h-screen bg-gray-100">
        <!-- Sidebar -->
        <div class="w-64 bg-indigo-800 text-white flex flex-col">
            <div class="p-5 text-2xl font-bold tracking-wider">EL TORO DASHBOARD</div>
            <nav class="flex-1 px-4 py-4 space-y-2">
                <a href="#" class="block px-4 py-2 rounded bg-indigo-900 text-white">Ringkasan Utama</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold text-gray-800">Performance Summary 2026</h1>
                <span id="loading-status" class="text-sm text-gray-500">Memuat data...</span>
            </header>

            <main class="p-6">
                <!-- Cards Summary -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="bg-white p-5 rounded-lg shadow">
                        <h3 class="text-gray-500 text-sm font-semibold">Total Pendapatan (Amount)</h3>
                        <p id="total-amount" class="text-2xl font-bold text-indigo-600 mt-2">Rp 0</p>
                    </div>
                    <div class="bg-white p-5 rounded-lg shadow">
                        <h3 class="text-gray-500 text-sm font-semibold">Total Transaksi</h3>
                        <p id="total-txn" class="text-2xl font-bold text-green-600 mt-2">0</p>
                    </div>
                    <div class="bg-white p-5 rounded-lg shadow">
                        <h3 class="text-gray-500 text-sm font-semibold">Jumlah Agen Aktif</h3>
                        <p id="total-agents" class="text-2xl font-bold text-blue-600 mt-2">0</p>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h3 class="text-lg font-bold text-gray-700 mb-4">Pendapatan per Bulan</h3>
                        <canvas id="monthlyChart"></canvas>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h3 class="text-lg font-bold text-gray-700 mb-4">Distribusi Produk Teratas</h3>
                        <canvas id="productChart"></canvas>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Ganti dengan nama file CSV Anda di repository GitHub yang sama
        const csvFilePath = 'SUMMARY 2026 - RAW_COMBINED.csv';

        Papa.parse(csvFilePath, {
            download: true,
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                document.getElementById('loading-status').innerText = 'Data berhasil dimuat';
                
                processDashboardData(data);
            },
            error: function(err) {
                document.getElementById('loading-status').innerText = 'Gagal memuat data CSV';
                console.error('Error loading CSV:', err);
            }
        });

        function processDashboardData(data) {
            let totalAmount = 0;
            let totalTxn = 0;
            const agents = new Set();
            const monthlyData = {};
            const productData = {};

            data.forEach(row => {
                // Kalkulasi Amount (Pastikan dibersihkan jika berupa string berformat titik/koma)
                let amount = row['Amount'];
                if (typeof amount === 'string') {
                    amount = parseFloat(amount.replace(/\./g, '').replace(',', '.')) || 0;
                }
                totalAmount += amount || 0;

                let txn = parseInt(row['Txn']) || 1;
                totalTxn += txn;

                if (row['Agent Name']) agents.add(row['Agent Name']);

                // Grouping per Bulan
                let month = row['Month'] || 'Unknown';
                monthlyData[month] = (monthlyData[month] || 0) + (amount || 0);

                // Grouping per Produk
                let product = row['Product Type'] || 'Lainnya';
                if (product !== 'Product Type') {
                    productData[product] = (productData[product] || 0) + 1;
                }
            });

            // Update UI Cards
            document.getElementById('total-amount').innerText = 'Rp ' + totalAmount.toLocaleString('id-ID');
            document.getElementById('total-txn').innerText = totalTxn.toLocaleString('id-ID');
            document.getElementById('total-agents').innerText = agents.size.toLocaleString('id-ID');

            // Render Chart Bulanan
            const sortedMonths = Object.keys(monthlyData).sort();
            const monthlyValues = sortedMonths.map(m => monthlyData[m]);

            const ctxMonthly = document.getElementById('monthlyChart').getContext('2d');
            new Chart(ctxMonthly, {
                type: 'line',
                data: {
                    labels: sortedMonths,
                    datasets: [{
                        label: 'Pendapatan (Rp)',
                        data: monthlyValues,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        tension: 0.1
                    }]
                }
            });

            // Render Chart Produk (Top 5)
            const sortedProducts = Object.entries(productData).sort((a,b) => b[1] - a[1]).slice(0, 5);
            const prodLabels = sortedProducts.map(p => p[0]);
            const prodValues = sortedProducts.map(p => p[1]);

            const ctxProduct = document.getElementById('productChart').getContext('2d');
            new Chart(ctxProduct, {
                type: 'bar',
                data: {
                    labels: prodLabels,
                    datasets: [{
                        label: 'Jumlah Penjualan',
                        data: prodValues,
                        backgroundColor: '#10b981'
                    }]
                }
            });
        }
    </script
