<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OEC Performance - Support EL TORO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --ink: #06223a;
  --muted: #4e7190;
  --line: #c7d8e8;
  --background: #eef6fb;
  --panel: #ffffff;
  --teal: #18bfe8;
  --teal-dark: #0b6f96;
  --teal-soft: #e3f7ff;
  --green: #16c995;
  --green-soft: #e4fbf4;
  --amber: #b36a00;
  --amber-soft: #fff4d8;
  --red: #b42318;
  --red-soft: #fff0ee;
  --pink: #ff2aa1;
  --purple: #9650dc;
  --orange: #ff9f2f;
  --blue: #367ff0;
}

#accessGate {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 24px;
  background-color: #f4f9ff;
  background-image:
    linear-gradient(rgba(54,127,240,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(54,127,240,.09) 1px, transparent 1px);
  background-size: 40px 40px;
}
#accessGate[hidden] { display: none; }
.access-title {
  margin: 0;
  color: #06223a;
  font-size: clamp(34px, 6vw, 62px);
  font-weight: 900;
  letter-spacing: .12em;
  text-align: center;
  text-shadow: 0 4px 0 rgba(54,127,240,.08);
}
.access-card {
  width: min(440px, 100%);
  padding: 28px 24px 26px;
  border: 1px solid #cfe0f2;
  border-radius: 12px;
  background: rgba(255,255,255,.94);
  box-shadow: 0 24px 60px rgba(25,74,124,.16);
  text-align: center;
}
.access-card h2, .access-card > p { display: none; }
.bull-logo { margin: -4px auto 15px; font-size: 66px; line-height: 1; filter: drop-shadow(0 8px 8px rgba(44,100,170,.16)); }
.access-card label { display: none; }
.access-card input { box-sizing: border-box; width: 100%; padding: 14px 16px; border: 2px solid #2e8af0; border-radius: 10px; background: #fff; color: var(--ink); font: inherit; font-size: 16px; text-align: center; outline: none; box-shadow: 0 0 0 4px rgba(46,138,240,.12); }
.access-card input::placeholder { color: #8aa2bd; }
.access-card button { display: grid; place-items: center; width: 90px; height: 90px; margin: 16px auto 0; border: 0; border-radius: 9px; background: #2d86e8; color: #fff; cursor: pointer; font-size: 42px; line-height: 1; box-shadow: 0 12px 24px rgba(45,134,232,.28); }
.access-card button:hover { background: #176fc9; transform: translateY(-1px); }
.access-error { min-height: 18px; margin-top: 9px !important; color: var(--red) !important; font-size: 11px !important; }
body.access-locked > :not(#accessGate) { visibility: hidden; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  color: var(--ink);
  background: linear-gradient(180deg, #eaf7fd 0, #f6fbff 220px, #eef6fb 100%);
  font-family: Inter, Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 0;
}

button, input, select { font: inherit; }
button { cursor: pointer; }

.topbar {
  min-height: 78px;
  padding: 14px max(24px, calc((100vw - 1480px) / 2));
  background: linear-gradient(90deg, #fff 0%, #effaff 52%, #fff4fb 100%);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.eyebrow {
  margin: 0 0 3px;
  color: var(--teal);
  font-size: 11px;
  font-weight: 700;
}

h1 { margin: 0; font-size: 24px; }
h2 { margin: 0; font-size: 15px; }

.top-actions { display: flex; align-items: center; gap: 12px; }
.status-dot { color: var(--muted); font-size: 12px; }
.status-dot::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 7px;
  border-radius: 50%;
  background: #98a2b3;
}
.status-dot.ready::before { background: var(--green); }

.icon-button {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
}
.icon-button:disabled { opacity: .45; cursor: default; }

svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

main {
  width: min(1680px, calc(100% - 20px));
  margin: 10px auto 28px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.tab-button {
  min-height: 40px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-bottom: 0;
  border-radius: 7px 7px 0 0;
  background: transparent;
  color: var(--muted);
  font-weight: 700;
  white-space: nowrap;
}
.tab-button.active {
  background: #fff;
  color: var(--teal-dark);
  border-color: var(--line);
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.rules-strip {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.rules-strip div { padding: 9px 12px; border-right: 1px solid var(--line); }
.rules-strip div:last-child { border-right: 0; }
.rules-strip span { display: block; color: var(--muted); font-size: 11px; }
.rules-strip strong { display: block; margin-top: 4px; font-size: 14px; }

.empty-state {
  min-height: 350px;
  display: grid;
  align-content: center;
  justify-items: center;
  text-align: center;
  color: var(--muted);
}
.empty-state h2 { margin-top: 14px; color: var(--ink); }
.empty-state p { max-width: 520px; margin: 8px 0; line-height: 1.6; }
.empty-icon {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  color: var(--teal);
  background: var(--teal-soft);
  border-radius: 8px;
}

.dashboard { margin-top: 14px; }
.filters {
  display: flex;
  gap: 8px;
  align-items: end;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.field { min-width: 190px; }
.field.grow { flex: 1; }
.field input, .field select { width: 100%; }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 8px;
}
.kpi {
  min-height: 82px;
  padding: 10px 12px;
  background: linear-gradient(180deg, #ffffff, #f7fcff);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.kpi span { color: var(--muted); font-size: 11px; font-weight: 600; }
.kpi strong { display: block; margin-top: 8px; font-size: 19px; }
.kpi small { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; }

.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 8px;
  align-items: start;
}
.table-panel, .detail-panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.panel-heading {
  min-height: 54px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.panel-heading p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
.count-chip { padding: 5px 8px; border-radius: 6px; background: #eef2f6; color: #475467; font-size: 11px; }

.table-wrap { max-height: 640px; overflow: auto; }
table { width: 100%; border-collapse: collapse; white-space: nowrap; }
th {
  position: sticky;
  top: 0;
  z-index: 1;
  padding: 7px 8px;
  background: #f8fafb;
  border-bottom: 1px solid var(--line);
  color: #667085;
  font-size: 10px;
  text-align: left;
  text-transform: uppercase;
}
td { padding: 8px 8px; border-bottom: 1px solid #edf0f3; font-size: 11px; }
tbody tr { cursor: pointer; }
tbody tr:hover, tbody tr.selected { background: #f0f8f8; }
.money, .number { text-align: right; font-variant-numeric: tabular-nums; }

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
}
.badge.eligible { background: var(--green-soft); color: var(--green); }
.badge.not-eligible { background: var(--amber-soft); color: var(--amber); }

.detail-panel { min-height: 300px; }
.detail-empty { padding: 36px 18px; color: var(--muted); text-align: center; font-size: 12px; }
.agent-head {
  padding: 11px 12px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
  border-bottom: 1px solid var(--line);
}
.agent-head strong { display: block; font-size: 14px; }
.agent-head span:not(.badge) { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
.progress-block { padding: 11px 12px; border-bottom: 1px solid var(--line); }
.progress-block > div:first-child { display: flex; justify-content: space-between; font-size: 11px; }
.progress-track { height: 8px; margin: 10px 0 7px; overflow: hidden; border-radius: 4px; background: #e8ecef; }
.progress-track span { display: block; height: 100%; max-width: 100%; background: var(--teal); }
.progress-block small { color: var(--muted); font-size: 10px; }
.product-list { padding: 6px 12px 10px; }
.product-row {
  padding: 10px 0;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 5px 12px;
  border-bottom: 1px solid #edf0f3;
}
.product-row:last-child { border-bottom: 0; }
.product-row strong { font-size: 11px; }
.product-row span { color: var(--muted); font-size: 10px; }
.product-row .product-money { grid-row: 1 / span 2; grid-column: 2; color: var(--ink); text-align: right; }

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  max-width: min(400px, calc(100% - 40px));
  padding: 11px 14px;
  border-radius: 7px;
  background: #172033;
  color: #fff;
  font-size: 12px;
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition: .2s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

.dodolan-board { max-height: 720px; overflow: auto; }
.leader-group { border-bottom: 1px solid var(--line); }
.leader-group:last-child { border-bottom: 0; }
.leader-summary {
  position: sticky;
  top: 0;
  z-index: 2;
  min-height: 34px;
  padding: 6px 10px;
  display: grid;
  grid-template-columns: 22px minmax(220px, 1fr) 76px 130px;
  gap: 8px;
  align-items: center;
  background: #e8eef4;
  cursor: pointer;
}
.leader-toggle {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border: 1px solid #91a4b8;
  border-radius: 4px;
  background: #fff;
  color: #476176;
  font-weight: 700;
}
.leader-summary span {
  color: #475467;
  font-size: 11px;
  font-weight: 700;
  text-align: right;
}
.leader-group.collapsed .dodolan-table-wrap { display: none; }
.dodolan-table-wrap { overflow-x: auto; }
.dodolan-table th { top: 34px; }
.dodolan-table { table-layout: fixed; }
.dodolan-table th:nth-child(1), .dodolan-table td:nth-child(1) { width: 64px; }
.dodolan-table th:nth-child(2), .dodolan-table td:nth-child(2) { width: auto; white-space: normal; }
.dodolan-table th:nth-child(3), .dodolan-table td:nth-child(3) { width: 170px; }
.dodolan-table th:nth-child(4), .dodolan-table td:nth-child(4) { width: 52px; }
.dodolan-table th:nth-child(5), .dodolan-table td:nth-child(5) { width: 120px; }
.package-name { line-height: 1.25; }
.package-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 8px;
  border-radius: 2px;
  vertical-align: -1px;
}
.campaign-line, .assigned-date-line {
  display: block;
  width: fit-content;
  max-width: 100%;
  margin-top: 3px;
  padding: 2px 5px;
  border-radius: 4px;
  line-height: 1.25;
  font-size: 10px;
}
.assigned-date-line {
  background: #eef6ff;
  color: #315f88;
  font-weight: 700;
}
.campaign-gold { background-color: #f6d66b; color: #533f00; }
.campaign-green { background-color: #95c77b; color: #123d1c; }
.campaign-purple { background-color: #bca8e8; color: #2e1f5e; }
.campaign-blue { background-color: #9fc4df; color: #143d59; }
.campaign-gray { background-color: #e4e7ec; color: #475467; }

.campaign-rank-list { display: grid; gap: 8px; padding: 10px; }
.campaign-rank-card {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 170px;
  gap: 12px;
  align-items: center;
  padding: 11px 12px;
  border: 1px solid #e
